<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSMD Segment Viewer</title>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="map"></div>

    <div class="legend" aria-label="Map legend">
      <h1>CSMD Segments</h1>
      <div class="legend-row">
        <span class="swatch swatch-csmd"></span>
        <span>Morphologically Deprived</span>
      </div>
      <div class="legend-row">
        <span class="swatch swatch-other"></span>
        <span>Morphologically Non-deprived</span>
      </div>
      <p class="note">
        CSMD is a morphology-based screening layer. It identifies city
        segments with built-form patterns associated with deprivation and
        should not be interpreted as a household-level poverty measure or an
        official slum census.
      </p>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
    <script src="app.js"></script>
  </body>
</html>

    <title>CSMD Explorer</title>
    <style>
      html,
      body {

        padding: 24px;
        color: #202020;
        background: #f6f6f4;
        font-family: Arial, Helvetica, sans-serif;
      }

        width: min(640px, 100%);
        padding: 32px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #d8d8d8;
        border-radius: 6px;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.1);

      }

      h1 {
        margin: 0;
        color: #111;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 16px auto 0;
        max-width: 520px;

    <script>
